services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-processos}
      POSTGRES_USER: ${POSTGRES_USER:-processos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-processos}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - processos

  backend:
    build:
      context: ./backend
      target: development
    environment:
      PROCESSOS_ENVIRONMENT: ${PROCESSOS_ENVIRONMENT:-development}
      PROCESSOS_LOG_LEVEL: ${PROCESSOS_LOG_LEVEL:-INFO}
      PROCESSOS_DATABASE_URL: ${PROCESSOS_DATABASE_URL:-postgresql+asyncpg://processos:processos@db:5432/processos}
      PROCESSOS_JWT_SECRET: ${PROCESSOS_JWT_SECRET:-development-only-secret-change-before-use}
      PROCESSOS_CORS_ORIGINS: '${PROCESSOS_CORS_ORIGINS:-["http://localhost:3000"]}'
      PROCESSOS_OVERPASS_ENDPOINTS: '${PROCESSOS_OVERPASS_ENDPOINTS:-["https://overpass.kumi.systems/api/interpreter","https://overpass-api.de/api/interpreter"]}'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - processos

  web:
    build:
      context: ./apps/web
      target: development
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${AUDIT_WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - processos

  app:
    build:
      context: ./apps/app
      target: development
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      PROCESSOS_API_URL: http://backend:8000
    ports:
      - "${COMMERCIAL_APP_PORT:-3001}:3000"
    volumes:
      - ./apps/app:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - processos

volumes:
  postgres_data:
  web_node_modules:
  web_next:
  app_node_modules:
  app_next:

networks:
  processos:
    driver: bridge
